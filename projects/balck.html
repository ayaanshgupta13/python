<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Tic-Tac-Toe Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        
        .cell {
            transition: all 0.3s ease;
            transform-style: preserve-3d;
        }
        
        .cell:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        
        .cell.x::before, .cell.o::before {
            opacity: 0;
            animation: appear 0.4s forwards;
        }
        
        @keyframes appear {
            to { opacity: 1; }
        }
        
        .celebrate {
            animation: celebrate 0.6s ease-in-out;
        }
        
        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(0.95); }
            75% { transform: scale(1.05); }
        }
        
        .win-line {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
            transform-origin: 0 0;
        }
    </style>
</head>
<body>
    <div class="max-w-xl w-full mx-auto">
        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-8 shadow-xl border border-white/20">
            <h1 class="text-3xl font-bold text-center text-white mb-2">Tic-Tac-Toe</h1>
            <p class="text-center text-white/80 mb-6">The classic game with a modern twist</p>
            
            <div class="flex justify-between items-center mb-6">
                <div class="bg-blue-500/20 px-4 py-2 rounded-lg">
                    <p class="text-sm text-white/80">Player X</p>
                    <p class="text-xl font-bold text-white" id="scoreX">0</p>
                </div>
                
                <div class="text-white font-semibold text-lg" id="turnIndicator">
                    Player X's turn
                </div>
                
                <div class="bg-purple-500/20 px-4 py-2 rounded-lg">
                    <p class="text-sm text-white/80">Player O</p>
                    <p class="text-xl font-bold text-white" id="scoreO">0</p>
                </div>
            </div>
            
            <div class="relative grid grid-cols-3 gap-3 mb-6" id="board">
                <!-- Cells will be generated by JavaScript -->
            </div>
            
            <div class="flex justify-center">
                <button id="resetBtn" class="bg-white/20 hover:bg-white/30 text-white px-6 py-2 rounded-lg transition-colors duration-300">
                    Restart Game
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const board = document.getElementById('board');
            const turnIndicator = document.getElementById('turnIndicator');
            const resetBtn = document.getElementById('resetBtn');
            const scoreXElement = document.getElementById('scoreX');
            const scoreOElement = document.getElementById('scoreO');
            
            let boardState = ['', '', '', '', '', '', '', '', ''];
            let currentPlayer = 'X';
            let gameActive = true;
            let score = { X: 0, O: 0 };
            
            // Create the game board cells
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell bg-white/10 aspect-square flex items-center justify-center text-6xl font-bold text-white cursor-pointer hover:bg-white/20';
                cell.dataset.index = i;
                board.appendChild(cell);
            }
            
            const cells = document.querySelectorAll('.cell');
            
            // Winning combinations (indices)
            const winCombinations = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
                [0, 4, 8], [2, 4, 6]             // diagonals
            ];
            
            // Handle cell click
            const handleCellClick = (e) => {
                const clickedCell = e.target;
                const clickedCellIndex = parseInt(clickedCell.dataset.index);
                
                // If cell is already filled or game is not active, ignore click
                if (boardState[clickedCellIndex] !== '' || !gameActive) return;
                
                // Update board state
                boardState[clickedCellIndex] = currentPlayer;
                
                // Update UI
                clickedCell.classList.add(currentPlayer.toLowerCase());
                
                // Create SVG for X or O
                const symbol = document.createElement('div');
                symbol.className = 'symbol';
                
                if (currentPlayer === 'X') {
                    clickedCell.innerHTML = `
                        <svg viewBox="0 0 100 100" class="w-16 h-16">
                            <line x1="15" y1="15" x2="85" y2="85" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
                            <line x1="85" y1="15" x2="15" y2="85" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
                        </svg>
                    `;
                } else {
                    clickedCell.innerHTML = `
                        <svg viewBox="0 0 100 100" class="w-16 h-16">
                            <circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="10" fill="transparent"/>
                        </svg>
                    `;
                }
                
                // Check for win or draw
                if (checkWin()) {
                    handleWin();
                    return;
                } else if (checkDraw()) {
                    handleDraw();
                    return;
                }
                
                // Switch player
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateTurnIndicator();
            };
            
            // Check for a win
            const checkWin = () => {
                return winCombinations.some(combination => {
                    return combination.every(index => {
                        return boardState[index] === currentPlayer;
                    });
                });
            };
            
            // Check for a draw
            const checkDraw = () => {
                return !boardState.includes('');
            };
            
            // Handle win
            const handleWin = () => {
                gameActive = false;
                score[currentPlayer]++;
                updateScore();
                
                // Highlight winning cells
                const winningCombination = winCombinations.find(combination => {
                    return combination.every(index => {
                        return boardState[index] === currentPlayer;
                    });
                });
                
                winningCombination.forEach(index => {
                    cells[index].classList.add('celebrate');
                });
                
                turnIndicator.textContent = `Player ${currentPlayer} wins!`;
                turnIndicator.classList.add('celebrate');
                
                // Draw win line
                drawWinLine(winningCombination);
            };
            
            // Draw the win line
            const drawWinLine = (combination) => {
                const cell1 = cells[combination[0]].getBoundingClientRect();
                const cell2 = cells[combination[2]].getBoundingClientRect();
                
                const boardRect = board.getBoundingClientRect();
                
                const x1 = cell1.left - boardRect.left + cell1.width / 2;
                const y1 = cell1.top - boardRect.top + cell1.height / 2;
                const x2 = cell2.left - boardRect.left + cell2.width / 2;
                const y2 = cell2.top - boardRect.top + cell2.height / 2;
                
                const length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
                const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
                
                const line = document.createElement('div');
                line.className = 'win-line';
                line.style.width = `${length}px`;
                line.style.height = '8px';
                line.style.left = `${x1}px`;
                line.style.top = `${y1}px`;
                line.style.transform = `rotate(${angle}deg)`;
                
                board.appendChild(line);
                
                // Animate the line
                setTimeout(() => {
                    line.style.transition = 'width 0.3s ease';
                    line.style.width = `${length}px`;
                }, 10);
            };
            
            // Handle draw
            const handleDraw = () => {
                gameActive = false;
                turnIndicator.textContent = 'Game ended in a draw!';
            };
            
            // Update turn indicator
            const updateTurnIndicator = () => {
                turnIndicator.textContent = `Player ${currentPlayer}'s turn`;
                turnIndicator.className = currentPlayer === 'X' 
                    ? 'text-blue-300 font-semibold text-lg' 
                    : 'text-purple-300 font-semibold text-lg';
            };
            
            // Update score display
            const updateScore = () => {
                scoreXElement.textContent = score.X;
                scoreOElement.textContent = score.O;
            };
            
            // Reset the game
            const resetGame = () => {
                boardState = ['', '', '', '', '', '', '', '', ''];
                currentPlayer = 'X';
                gameActive = true;
                
                cells.forEach(cell => {
                    cell.classList.remove('x', 'o', 'celebrate');
                    cell.innerHTML = '';
                });
                
                updateTurnIndicator();
                
                // Remove win lines
                const winLines = document.querySelectorAll('.win-line');
                winLines.forEach(line => line.remove());
                
                // Reset turn indicator animation
                turnIndicator.classList.remove('celebrate');
            };
            
            // Event listeners
            cells.forEach(cell => cell.addEventListener('click', handleCellClick));
            resetBtn.addEventListener('click', resetGame);
            
            // Initialize game
            updateTurnIndicator();
            updateScore();
        });
    </script>
</body>
</html>
