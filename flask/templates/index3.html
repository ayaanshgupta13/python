<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 0;
            list-style: none;
        }
        .product-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        a {
            text-decoration: none;
            color: #333;
        }
        .price {
            color: #007BFF;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Product List</h1>
    <ul class="products">
        {% for product in products %}
        <li class="product-card">
            <a href="{{ url_for('product_page', product_id=product.id) }}">
                <h3>{{ product.name }}</h3>
                <p class="price">${{ product.price | round(2) }}</p>
            </a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
